[project]
name = "langgraph-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "alfredo.calle.dev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "langchain>=1.3.16",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.0",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "pypdf>=6.16.1",
]

[project.scripts]
langgraph-rag = "langgraph_rag.main:start_app"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
